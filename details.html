<!DOCTYPE html>
<html>
<head>
    <title>Submitted Details</title>
</head>
<body>

    <h1>Submitted Details</h1>

    <p><b>Name:</b> {{ name }}</p>
    <p><b>Age:</b> {{ age }}</p>
    <p><b>Issue:</b> {{ issue }}</p>
    <p><b>Email:</b> {{ email }}</p>
    <p><b>Phone:</b> {{ phone }}</p>
    <p><b>Gender:</b> {{ gender }}</p>
    <p><b>Date:</b> {{ date }}</p>
    <p><b>Day:</b> {{ day }}</p>
</body>
</html>
